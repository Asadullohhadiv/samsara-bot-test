<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FleetGuard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* ===== LOGIN SCREEN ===== */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-logo {
            font-size: 60px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        .login-title {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }
        .login-form {
            width: 100%;
            max-width: 380px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            font-size: 16px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            outline: none;
            transition: border 0.3s;
        }
        .form-group input:focus {
            border-color: #00d2ff;
            background: rgba(0,0,0,0.5);
        }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #aaa;
        }
        .remember-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00d2ff;
        }
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,210,255,0.3);
        }
        .login-btn:hover {
            transform: translateY(-2px);
        }
        .login-btn:disabled {
            opacity: 0.6;
            transform: none;
        }
        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }

        /* ===== MAIN APP (after login) ===== */
        .app-screen {
            display: none;
            min-height: 100vh;
            background: #f5f5f5;
            color: #222;
        }

        /* Header */
        .app-header {
            background: #1a1a2e;
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .app-header h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .truck-info {
            font-size: 14px;
            opacity: 0.9;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Horizontal Tabs */
        .tab-bar {
            display: flex;
            background: white;
            border-bottom: 1px solid #eee;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tab-bar::-webkit-scrollbar {
            display: none;
        }
        .tab {
            flex: 1;
            min-width: 80px;
            text-align: center;
            padding: 14px 8px;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab.active {
            color: #0f3460;
            border-bottom-color: #0f3460;
            font-weight: 700;
        }
        .tab .tab-icon {
            display: block;
            font-size: 20px;
            margin-bottom: 4px;
        }

        /* Content */
        .content {
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #0f3460;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            display: block;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            background: #fafafa;
            outline: none;
        }
        .form-group input:focus {
            border-color: #0f3460;
            background: white;
        }
        .primary-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .primary-btn:hover {
            opacity: 0.9;
        }
        .secondary-btn {
            width: 100%;
            padding: 10px;
            background: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }
        .result-box {
            margin-top: 16px;
            padding: 14px;
            background: #f9f9f9;
            border-radius: 10px;
            border-left: 4px solid #0f3460;
        }
        .list-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .price {
            color: #27ae60;
            font-weight: 700;
        }
        .error {
            color: #e74c3c;
        }
        .success {
            color: #27ae60;
        }
        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        .hidden {
            display: none;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
            background: white;
        }
        footer a {
            color: #0f3460;
            text-decoration: none;
        }
    </style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen" class="login-screen">
    <div class="login-logo">🚛</div>
    <h1 class="login-title">FleetGuard</h1>
    <p class="login-subtitle">Professional Fleet Management</p>
    <form id="loginForm" class="login-form">
        <div class="form-group">
            <label>Truck Number</label>
            <input type="text" id="loginTruck" placeholder="e.g., 88817" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>
        <div class="remember-row">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember me</label>
        </div>
        <button type="submit" class="login-btn">Login</button>
        <div id="loginError" class="login-error"></div>
    </form>
</div>

<!-- ===== DRIVER APP SCREEN ===== -->
<div id="appScreen" class="app-screen">
    <div class="app-header">
        <h1>FleetGuard</h1>
        <div class="truck-info" id="truckInfo">Truck: -</div>
    </div>

    <div class="tab-bar">
        <div class="tab active" data-tab="fuel" onclick="showTab('fuel')">
            <span class="tab-icon">⛽</span>Fuel
        </div>
        <div class="tab" data-tab="pti" onclick="showTab('pti')">
            <span class="tab-icon">📋</span>PTI
        </div>
        <div class="tab" data-tab="points" onclick="showTab('points')">
            <span class="tab-icon">💰</span>Points
        </div>
        <div class="tab" data-tab="verify" onclick="showTab('verify')">
            <span class="tab-icon">✅</span>Verify
        </div>
        <div class="tab" data-tab="history" onclick="showTab('history')">
            <span class="tab-icon">📜</span>History
        </div>
    </div>

    <div class="content">
        <div id="fuel" class="tab-content">
            <div class="card">
                <h3>Search Fuel Stations</h3>
                <div class="form-group">
                    <label>Destination (optional)</label>
                    <input type="text" id="fuelDest" placeholder="e.g., 123 Main St, LA">
                </div>
                <button class="primary-btn" onclick="searchFuel()">🔍 Find Fuel</button>
                <div id="fuelResult" class="result-box hidden"></div>
            </div>
        </div>

        <div id="pti" class="tab-content hidden">
            <div class="card">
                <h3>Submit PTI</h3>
                <div class="form-group">
                    <label>PTI Number</label>
                    <input type="text" id="ptiNum" placeholder="e.g., PTI-12345">
                </div>
                <button class="primary-btn" onclick="submitPTI()">📤 Submit PTI</button>
                <div id="ptiResult" class="result-box hidden"></div>
            </div>
        </div>

        <div id="points" class="tab-content hidden">
            <div class="card">
                <h3>My Points</h3>
                <button class="primary-btn" onclick="showPoints()">💰 View Balance</button>
                <div id="pointsResult" class="result-box hidden"></div>
            </div>
        </div>

        <div id="verify" class="tab-content hidden">
            <div class="card">
                <h3>Verify Your Truck</h3>
                <div class="form-group">
                    <label>Driver Name</label>
                    <input type="text" id="verifyName" placeholder="e.g., John Doe">
                </div>
                <div class="form-group">
                    <label>Truck Front Photo</label>
                    <input type="file" id="verifyPhoto" accept="image/*">
                </div>
                <button class="primary-btn" onclick="submitVerification()">📷 Submit Verification</button>
                <div id="verifyResult" class="result-box hidden"></div>
            </div>
        </div>

        <div id="history" class="tab-content hidden">
            <div class="card">
                <h3>Fuel & PTI History</h3>
                <button class="primary-btn" onclick="showHistory()">📂 Load History</button>
                <div id="historyResult" class="result-box hidden"></div>
            </div>
        </div>
    </div>

    <footer>
        <a href="#" onclick="logout()">Logout</a> • <a href="/donate">💖 Donate</a>
    </footer>
</div>

<!-- ===== ADMIN APP SCREEN ===== -->
<div id="adminScreen" class="app-screen">
    <div class="app-header">
        <h1>FleetGuard Admin</h1>
        <div class="truck-info">Admin</div>
    </div>
    <div class="content">
        <div class="card">
            <h3>Admin Dashboard</h3>
            <button class="primary-btn" onclick="loadAdminData()">📊 Load Summary</button>
            <div id="adminResult" class="result-box hidden"></div>
        </div>
    </div>
    <footer>
        <a href="#" onclick="logout()">Logout</a>
    </footer>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    const initData = tg.initData;

    // Admin credentials
    const ADMIN_TRUCK = "1234";
    const ADMIN_PASSWORD = "Mytrucksafetypassword3223";

    // Check remember me on page load
    window.onload = function() {
        const savedTruck = localStorage.getItem('rememberedTruck');
        const savedPass = localStorage.getItem('rememberedPass');
        if (savedTruck && savedPass) {
            document.getElementById('loginTruck').value = savedTruck;
            document.getElementById('loginPassword').value = savedPass;
            document.getElementById('rememberMe').checked = true;
        }
    };

    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const adminScreen = document.getElementById('adminScreen');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const truck = document.getElementById('loginTruck').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const remember = document.getElementById('rememberMe').checked;

        if (!truck || !password) {
            loginError.textContent = "Please fill all fields";
            loginError.style.display = 'block';
            return;
        }

        const btn = loginForm.querySelector('.login-btn');
        btn.textContent = 'Logging in...';
        btn.disabled = true;
        loginError.style.display = 'none';

        try {
            // Check admin credentials first
            if (truck === ADMIN_TRUCK && password === ADMIN_PASSWORD) {
                // Admin login
                localStorage.setItem('role', 'admin');
                loginScreen.style.display = 'none';
                adminScreen.style.display = 'block';
                return;
            }

            // Normal driver login
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ truck_number: truck, password: password, init_data: initData })
            });
            const data = await response.json();

            if (!response.ok) {
                loginError.textContent = data.error || "Invalid truck number or password";
                loginError.style.display = 'block';
                btn.textContent = 'Login';
                btn.disabled = false;
                return;
            }

            // Remember me
            if (remember) {
                localStorage.setItem('rememberedTruck', truck);
                localStorage.setItem('rememberedPass', password);
            } else {
                localStorage.removeItem('rememberedTruck');
                localStorage.removeItem('rememberedPass');
            }

            localStorage.setItem('role', 'driver');
            localStorage.setItem('truck_number', truck);
            document.getElementById('truckInfo').textContent = 'Truck: ' + truck;
            loginScreen.style.display = 'none';
            appScreen.style.display = 'block';
            showTab('fuel');
        } catch (err) {
            loginError.textContent = "Network error: " + err.message;
            loginError.style.display = 'block';
        } finally {
            btn.textContent = 'Login';
            btn.disabled = false;
        }
    });

    // Tab switching
    function showTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(tabId).classList.remove('hidden');
        document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active');
    }

    // Logout
    function logout() {
        localStorage.removeItem('role');
        if (!document.getElementById('rememberMe').checked) {
            localStorage.removeItem('rememberedTruck');
            localStorage.removeItem('rememberedPass');
        }
        adminScreen.style.display = 'none';
        appScreen.style.display = 'none';
        loginScreen.style.display = 'flex';
        document.getElementById('loginPassword').value = '';
    }

    // ===== FUEL SEARCH =====
    async function searchFuel() {
        const dest = document.getElementById('fuelDest').value.trim();
        const resDiv = document.getElementById('fuelResult');
        resDiv.classList.remove('hidden');
        resDiv.innerHTML = '<div class="loading">⏳ Searching...</div>';

        try {
            const resp = await fetch('/api/fuel-search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ destination: dest, init_data: initData })
            });
            const data = await resp.json();
            if (!resp.ok) {
                resDiv.innerHTML = `<div class="error">❌ ${data.error || 'Error'}</div>`;
                return;
            }
            let html = '<h4>Fuel Stations</h4>';
            if (data.stations && data.stations.length > 0) {
                data.stations.forEach(s => {
                    html += `<div class="list-item">
                        <b>${s.name || 'Unknown'}</b><br>
                        <span class="price">${s.price ? '$' + s.price.toFixed(2) : 'N/A'}</span>
                        <span> | ${s.distance_from_truck} mi</span><br>
                        <small>${s.address || ''}</small><br>
                        <button class="secondary-btn" onclick="useStation('${s.name}', '${s.address}', ${s.lat}, ${s.lng}, ${s.price})">I used this</button>
                    </div>`;
                });
            } else {
                html += '<p>No stations found.</p>';
            }
            resDiv.innerHTML = html;
        } catch (err) {
            resDiv.innerHTML = '<div class="error">Network error</div>';
        }
    }

    async function useStation(name, address, lat, lng, price) {
        if (!confirm('Confirm you used this station?')) return;
        try {
            const resp = await fetch('/api/use-station', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    station_name: name,
                    station_address: address,
                    station_lat: lat,
                    station_lng: lng,
                    price: price,
                    init_data: initData
                })
            });
            const data = await resp.json();
            alert(data.message || 'Recorded!');
        } catch (err) {
            alert('Error recording station');
        }
    }

    // ===== PTI =====
    async function submitPTI() {
        const pti = document.getElementById('ptiNum').value.trim();
        if (!pti) { alert('Enter PTI number'); return; }
        const resDiv = document.getElementById('ptiResult');
        resDiv.classList.remove('hidden');
        resDiv.innerHTML = '<div class="loading">Submitting...</div>';
        try {
            const resp = await fetch('/api/submit-pti', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pti_number: pti, init_data: initData })
            });
            const data = await resp.json();
            resDiv.innerHTML = data.message ? `<div class="success">✅ ${data.message}</div>` : `<div class="error">❌ ${data.error}</div>`;
        } catch (err) {
            resDiv.innerHTML = '<div class="error">Network error</div>';
        }
    }

    // ===== POINTS =====
    async function showPoints() {
        const resDiv = document.getElementById('pointsResult');
        resDiv.classList.remove('hidden');
        resDiv.innerHTML = '<div class="loading">Loading...</div>';
        try {
            const resp = await fetch('/api/points', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ init_data: initData })
            });
            const data = await resp.json();
            let html = `<h3>Balance: <span style="color:#27ae60;">${data.balance} pts</span></h3><br>`;
            if (data.history && data.history.length) {
                html += '<h4>Recent Transactions:</h4>';
                data.history.forEach(t => {
                    html += `<div class="list-item"><span>${t.type}</span><span>${t.amount > 0 ? '+' : ''}${t.amount} pts</span></div>`;
                });
            } else {
                html += '<p>No transactions yet.</p>';
            }
            resDiv.innerHTML = html;
        } catch (err) {
            resDiv.innerHTML = '<div class="error">Network error</div>';
        }
    }

    // ===== VERIFICATION =====
    async function submitVerification() {
        const name = document.getElementById('verifyName').value.trim();
        const photoInput = document.getElementById('verifyPhoto');
        if (!name || !photoInput.files.length) {
            alert('Fill name and upload photo');
            return;
        }
        const resDiv = document.getElementById('verifyResult');
        resDiv.classList.remove('hidden');
        resDiv.innerHTML = '<div class="loading">Uploading...</div>';

        const truck = localStorage.getItem('truck_number') || '';
        const formData = new FormData();
        formData.append('driver_name', name);
        formData.append('truck_number', truck);
        formData.append('photo', photoInput.files[0]);
        formData.append('init_data', initData);

        try {
            const resp = await fetch('/api/verify', { method: 'POST', body: formData });
            const data = await resp.json();
            resDiv.innerHTML = data.message ? `<div class="success">✅ ${data.message}</div>` : `<div class="error">❌ ${data.error}</div>`;
        } catch (err) {
            resDiv.innerHTML = '<div class="error">Network error</div>';
        }
    }

    // ===== HISTORY =====
    async function showHistory() {
        const resDiv = document.getElementById('historyResult');
        resDiv.classList.remove('hidden');
        resDiv.innerHTML = '<div class="loading">Loading...</div>';
        try {
            const resp = await fetch('/api/history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ init_data: initData })
            });
            const data = await resp.json();
            let html = '<h3>Fuel Usage</h3>';
            if (data.fuel_usage && data.fuel_usage.length) {
                data.fuel_usage.forEach(u => {
                    html += `<div class="list-item">${u.station_name} - ${u.used_at}</div>`;
                });
            } else {
                html += '<p>No fuel usage recorded.</p>';
            }
            html += '<h3>PTI Submissions</h3>';
            if (data.pti_history && data.pti_history.length) {
                data.pti_history.forEach(p => {
                    html += `<div class="list-item">${p.pti_number} - ${p.submitted_at}</div>`;
                });
            } else {
                html += '<p>No PTIs submitted.</p>';
            }
            resDiv.innerHTML = html;
        } catch (err) {
            resDiv.innerHTML = '<div class="error">Network error</div>';
        }
    }

    // ===== ADMIN DATA =====
    async function loadAdminData() {
        const resDiv = document.getElementById('adminResult');
        resDiv.classList.remove('hidden');
        resDiv.innerHTML = '<div class="loading">Loading...</div>';
        try {
            const resp = await fetch('/api/admin-summary', { method: 'GET' });
            const data = await resp.json();
            let html = '<h3>Points Summary</h3>';
            if (data.points && data.points.length) {
                data.points.forEach(p => {
                    html += `<div class="list-item">${p.driver_id}: ${p.balance} pts</div>`;
                });
            } else {
                html += '<p>No points data.</p>';
            }
            html += '<h3>PTI Counts</h3>';
            if (data.pti && data.pti.length) {
                data.pti.forEach(p => {
                    html += `<div class="list-item">${p.driver_id}: ${p.count} PTIs</div>`;
                });
            } else {
                html += '<p>No PTI data.</p>';
            }
            html += '<h3>Recent Fuel Usage</h3>';
            if (data.fuel_usage && data.fuel_usage.length) {
                data.fuel_usage.forEach(f => {
                    html += `<div class="list-item">${f.driver_id} - ${f.station_name} - ${f.used_at} - Confirmed: ${f.is_confirmed}</div>`;
                });
            } else {
                html += '<p>No fuel usage data.</p>';
            }
            resDiv.innerHTML = html;
        } catch (err) {
            resDiv.innerHTML = '<div class="error">Network error</div>';
        }
    }
</script>
</body>
</html>
