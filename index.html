<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Truck Safety</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom floating dock glassmorphism effect */
    .dock-backdrop {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen pb-28">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-blue-500/20">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-base leading-tight">My Truck Safety</h1>
          <p class="text-xs text-slate-500 font-medium">Fleet Management System</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <div class="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5">
          <i data-lucide="truck" class="w-3.5 h-3.5 text-slate-500"></i>
          <span>Truck #88817</span>
        </div>
        <button onclick="toggleAuthModal()" class="text-xs font-semibold text-slate-600 hover:text-red-600 transition-colors px-2.5 py-1.5 rounded-lg hover:bg-slate-100">
          Sign Out
        </button>
      </div>

    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-8">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 md:p-8 text-center">
      <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100">
        <i data-lucide="file-clock" class="w-6 h-6"></i>
      </div>
      
      <h2 class="text-xl font-bold text-slate-900">Driver History & Activity</h2>
      <p class="text-sm text-slate-500 mt-1 mb-6 max-w-md mx-auto">Fetch and review your pre-trip inspection logs, fuel reports, and safety verification history.</p>
      
      <button class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm px-6 py-3 rounded-xl shadow-lg shadow-blue-500/20 transition-all duration-150">
        <i data-lucide="folder-search" class="w-4 h-4"></i>
        Fetch Log History
      </button>
    </div>
  </main>

  <div class="fixed bottom-6 inset-x-0 z-40 flex justify-center px-4">
    <nav class="dock-backdrop border border-slate-200/90 shadow-2xl shadow-slate-300/50 rounded-2xl p-1.5 flex items-center gap-1 max-w-md w-full justify-around">
      
      <button class="flex-1 flex flex-col items-center justify-center py-2 px-2 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-100/60 transition-all">
        <i data-lucide="fuel" class="w-5 h-5 mb-1"></i>
        <span class="text-[11px] font-semibold tracking-tight">Fuel</span>
      </button>

      <button class="flex-1 flex flex-col items-center justify-center py-2 px-2 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-100/60 transition-all">
        <i data-lucide="clipboard-check" class="w-5 h-5 mb-1"></i>
        <span class="text-[11px] font-semibold tracking-tight">PTI</span>
      </button>

      <button class="flex-1 flex flex-col items-center justify-center py-2 px-2 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-100/60 transition-all">
        <i data-lucide="award" class="w-5 h-5 mb-1"></i>
        <span class="text-[11px] font-semibold tracking-tight">Points</span>
      </button>

      <button class="flex-1 flex flex-col items-center justify-center py-2 px-2 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-100/60 transition-all">
        <i data-lucide="check-circle-2" class="w-5 h-5 mb-1"></i>
        <span class="text-[11px] font-semibold tracking-tight">Verify</span>
      </button>

      <button class="flex-1 flex flex-col items-center justify-center py-2 px-2 rounded-xl bg-blue-600 text-white shadow-md shadow-blue-500/25 transition-all">
        <i data-lucide="file-clock" class="w-5 h-5 mb-1"></i>
        <span class="text-[11px] font-semibold tracking-tight">History</span>
      </button>

    </nav>
  </div>

  <div id="authModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl w-full max-w-sm p-6 relative">
      
      <button onclick="toggleAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="text-center mb-6 pt-2">
        <div class="w-12 h-12 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/30">
          <i data-lucide="shield-check" class="w-7 h-7"></i>
        </div>
        <h3 class="text-xl font-bold text-slate-900">My Truck Safety</h3>
        <p class="text-xs text-slate-500 mt-0.5">Workspace Fleet Management System</p>
      </div>

      <form onsubmit="event.preventDefault(); toggleAuthModal();" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Truck Number</label>
          <div class="relative">
            <input type="text" placeholder="e.g., 88817" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all"/>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <input type="password" placeholder="Enter security password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 pr-10 text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all"/>
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="remember" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 accent-blue-600">
          <label for="remember" class="text-xs font-medium text-slate-600 cursor-pointer">Remember login details</label>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm py-3 rounded-xl shadow-lg shadow-blue-500/25 transition-all duration-150 mt-2">
          Sign In
        </button>
      </form>

    </div>
  </div>

  <script>
    lucide.createIcons();

    function toggleAuthModal() {
      const modal = document.getElementById('authModal');
      modal.classList.toggle('hidden');
    }
  </script>
</body>
</html>
